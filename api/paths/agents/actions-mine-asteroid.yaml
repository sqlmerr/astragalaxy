post:
  operationId: mineAsteroidAction
  summary: Mine Asteroid Action
  tags:
    - Agents
    - Actions
  requestBody:
    required: true
    content: 
      application/json:
        schema:
          $ref: ../../components/schemas/MineAsteroidRequest.yaml
  responses:
    '200':
      description: Success
      content: 
        application/json:
          schema:
            $ref: ../../components/schemas/Cooldown.yaml
    '422':
      description: Not enough items or another internal game error
      content: 
        application/json:
          schema:
            $ref: ../../components/schemas/ErrorResponse.yaml
    '401':
      $ref: ../../components/responses/InvalidAgentToken.yaml
  security:
    - AgentAuth: []
    - UserAuth: []
      AgentId: []
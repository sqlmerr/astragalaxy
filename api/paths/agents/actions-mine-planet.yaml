post:
  operationId: minePlanetAction
  summary: Mine Planet Action
  tags:
    - Agents
    - Actions
  requestBody:
    required: true
    content: 
      application/json:
        schema:
          $ref: ../../components/schemas/MinePlanetRequest.yaml
  responses:
    '200':
      description: Success
      content: 
        application/json:
          schema:
            $ref: ../../components/schemas/Cooldown.yaml
    '422':
      description: Not enough inventory resource volume or another internal game error
      content: 
        application/json:
          schema:
            $ref: ../../components/schemas/ErrorResponse.yaml
    '404':
      description: Resource deposit not found on planet
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ErrorResponse.yaml
    '401':
      $ref: ../../components/responses/InvalidAgentToken.yaml
  security:
    - AgentAuth: []
    - UserAuth: []
      AgentId: []
allOf:
  - $ref: "ShortSystem.yaml"
  - type: object
    required:
      - planets
      - waypoints
      - discovered_by
      - discovered_at
    properties:
      planets:
        type: array
        items:
          $ref: "./Planet.yaml"
      waypoints:
        type: array
        items:
          $ref: "./Waypoint.yaml"
      discovered_by:
        type: string
        format: uuid
        description: Agent ID that discovered this system
      discovered_at:
        type: string
        format: date-time
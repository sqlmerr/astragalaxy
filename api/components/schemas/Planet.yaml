type: object
required:
  - name
  - type
  - orbit
  - deposits
properties:
  name:
    type: string
  type:
    type: string
    enum:
      - TERRA
      - OCEAN
      - SCORCHED
      - GLACIAL
      - TOXIC
  orbit:
    type: integer
  deposits:
    type: array
    items: 
      $ref: ResourceDeposit.yaml
    description: Resource deposits on this planet
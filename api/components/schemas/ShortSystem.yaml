type: object
required:
  - name
  - x
  - y
  - archetype
properties:
  name:
    type: string
  x:
    type: integer
    description: X coordinate
  y:
    type: integer
    description: Y coordinate
  archetype:
    type: string
    enum:
      - habitable
      - dead
      - frozen
    description: System archetype # TODO(docs): add link to archetype docs
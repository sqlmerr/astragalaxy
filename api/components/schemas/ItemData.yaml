type: object
required:
  - id
  - provides_facility
properties: 
  id: 
    type: string
    description: Item ID
  provides_facility:
    type: object
    description: Facility that item provides
    nullable: true
    required:
      - id
      - as
    properties: 
      id:
        type: string
        description: Facility ID
      as:
        type: array
        items: 
          type: string
          example: ship_module
        description: In which item states it provides this facility
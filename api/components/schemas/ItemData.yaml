type: object
required:
  - id
properties: 
  id: 
    type: string
    description: Item ID
  ship_module:
    type: object
    description: Item's ship module characteristics
    required:
      - provides_facility
      - mining
    properties: 
      provides_facility:
        type: string
        description: Facility that item provides being ship module
        example: portable_printer
        nullable: true
      mining:
        type: object
        description: Mining modifiers
        required:
          - speed_multiplier
        properties: 
          speed_multiplier:
            type: number
            format: float64

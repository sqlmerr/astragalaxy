type: object
required:
  - cooldown
  - fuel
  - discovery
properties: 
  cooldown:
    $ref: Cooldown.yaml
  fuel:
    type: object
    required:
      - resource_type
      - used
      - left
    properties:
      resource_type:
        type: string
        description: Resource type of the warp cell consumed
      used:
        type: integer
        description: Amount of warp cells consumed by this jump
      left:
        type: integer
        description: Amount of warp cells left in the ship inventory after the jump (0 means exhausted)
  discovery:
    oneOf:
      - $ref: SystemDiscovery.yaml
      - type: "null"
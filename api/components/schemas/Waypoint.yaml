type: object
required:
  - id
  - type
properties:
  id:
    type: integer
    description: Waypoint's ID inside system
  type:
    type: string
    description: Waypoint's type
    enum:
      - station
      - asteroid
  asteroid:
    type: object
    description: Asteroid data. Not null if type == asteroid
    nullable: true
    properties: 
      deposit:
        $ref: ResourceDeposit.yaml
  station:
    type: object
    description: Station data. Not null if type == station
    nullable: true
    properties: 
      facilities:
        type: array
        description: List of available facilities on this station
        items: 
          type: string
          description: Facility ID # TODO(docs)

type: object
required:
  - id
  - type
  - tier
  - modifiers
properties: 
  id:
    type: string
    description: Facility ID
    example: standard_printer
  type:
    type: string
    description: Facility type
    example: printer
  tier:
    type: integer
    description: Facility Tier
    minimum: 1
  modifiers:
    oneOf:
      - type: object
        required:
          - time_multiplier
          - cost_multiplier
        properties: 
          time_multiplier:
            type: number
            format: float64
            example: 1.0
          cost_multiplier:
            type: number
            format: float64
            example: 1.0
      - type: object
        description: dummy modifier type for now

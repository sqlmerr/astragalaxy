version: 2
overrides:
  go:
    overrides:
      - db_type: "pg_catalog.interval"
        engine: "postgresql"
        go_type:
          import: "time"
          type: "Duration"

sql:
  - engine: postgresql
    queries: "./internal/data/postgres/database/query"
    schema: "./internal/data/postgres/database/migration"
    gen:
      go:
        package: "database"
        sql_package: "pgx/v5"
        out: "./internal/data/postgres/database/sqlc"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            go_type: "*github.com/google/uuid.UUID"
            nullable: true